version: '3.8'

services:
  redis:
    image: redis:7
    container_name: loader-redis
    ports:
      - "6380:6379"  

  loader-node:
    build: .
    container_name: loader-node
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379  
    ports:
      - "8000:8000"
    command: npm start
